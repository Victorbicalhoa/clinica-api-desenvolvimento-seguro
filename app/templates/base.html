<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agenda clínica{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/agenda.css') }}">
</head>
<body>

    <div class="brand"><span class="brand-icon" aria-hidden="true">+</span> Agenda clínica</div>

</html>
