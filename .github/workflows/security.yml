name: DevSecOps

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Java para ZAP
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias fixadas
        run: |
          python -m pip install -r requirements.txt -r requirements-security.txt
          python -m pip check
      - name: Testes, SAST e SCA
        run: python -m scripts.run_checks
      - name: Auditar contrato OpenAPI
        run: python -m scripts.audit_openapi
      - name: Obter ZAP oficial com checksum
        run: python -m scripts.fetch_zap
      - name: DAST passivo autenticado em banco descartavel
        run: python -m scripts.run_dast --zap-home .cache/security-tools/ZAP_2.17.0
      - name: Aplicar security gate
        if: always()
        run: python -m scripts.security_gate --reports reports
      - name: Guardar evidencias sanitizadas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
